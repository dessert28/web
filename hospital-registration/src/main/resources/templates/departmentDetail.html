<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('科室详情 - 预约挂号')}"></head>
<body class="min-h-screen bg-surface-dim text-on-surface font-sans antialiased">

<header th:replace="~{fragments/layout :: appbar('科室详情', 'home')}"></header>

<main class="max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-8 md:py-12">

    <nav class="text-sm text-[#757575] mb-4">
        <a th:href="@{/home}" class="text-primary" style="text-decoration:none">科室首页</a>
        <span> / </span>
        <span th:text="${department != null} ? ${department.deptName} : '未知科室'">科室</span>
    </nav>

    <div th:replace="~{fragments/layout :: alert(${message}, 'error')}"></div>

    <!-- 科室信息 -->
    <section th:if="${department != null}"
             class="rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
        <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
                <h1 class="text-2xl md:text-3xl font-sans font-medium tracking-tight"
                    th:text="${department.deptName}">科室名</h1>
                <p class="text-sm md:text-base text-[#757575] mt-2">
                    位置：<span th:text="${department.location} ?: '未登记'">位置</span>
                    <span class="mx-2">|</span>
                    电话：<span th:text="${department.deptPhone} ?: '未登记'">电话</span>
                </p>
            </div>
            <span class="rounded-full bg-[#ede7f6] text-[#6200ee] text-sm px-3 py-1">
                医生 <span th:text="${department.doctorList != null ? #lists.size(department.doctorList) : 0}">0</span> 人
            </span>
        </div>
    </section>

    <section th:if="${department == null}"
             class="rounded-xl bg-white p-6 text-center text-[#757575] shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
        科室不存在或已下线，<a th:href="@{/home}" class="text-primary" style="text-decoration:none">返回科室首页</a>。
    </section>

    <!-- 医生列表 -->
    <section th:if="${department != null}"
             class="mt-6 rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
        <h2 class="font-sans font-medium tracking-tight text-lg md:text-xl mb-4">科室医生</h2>

        <div class="md-table-wrap">
            <table class="md-table">
                <thead>
                <tr>
                    <th scope="col">医生ID</th>
                    <th scope="col">医生姓名</th>
                    <th scope="col">性别</th>
                    <th scope="col">职称</th>
                    <th scope="col">专业专长</th>
                    <th scope="col">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doctor : ${department.doctorList}">
                    <td th:text="${doctor.id}"></td>
                    <td th:text="${doctor.doctorName}"></td>
                    <td th:text="${doctor.genderLabel}"></td>
                    <td th:text="${doctor.title}"></td>
                    <td class="text-sm" th:text="${doctor.specialty} ?: '暂未填写'"></td>
                    <td>
                        <a th:href="@{'/doctorDetail/' + ${doctor.id}}"
                           class="rounded-full bg-primary text-white text-sm px-4 py-1 inline-flex items-center justify-center md:ripple"
                           style="text-decoration:none">查看详情 / 挂号</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(department.doctorList)}">
                    <td colspan="6" class="text-center text-sm md:text-base text-[#757575] py-8">该科室暂无医生</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer class="bg-[#f5f5f5] text-[#757575] py-8 px-4 md:px-6 lg:px-8 mt-8">
    <div class="max-w-6xl mx-auto text-sm">© 2026 预约挂号系统 · 实验二：基于 Spring Boot 集成 MyBatis 实现患者挂号</div>
</footer>

</body>
</html>
