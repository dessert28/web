<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('医生工作台 - 预约挂号')}"></head>
<body class="min-h-screen bg-surface-dim text-on-surface font-sans antialiased">

<header th:replace="~{fragments/layout :: appbar('医生工作台', 'workbench')}"></header>

<main class="max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-8 md:py-12">

    <h1 class="text-2xl md:text-3xl font-sans font-medium tracking-tight">患者预约信息</h1>
    <p class="text-sm md:text-base text-[#757575] mt-2">
        <span th:text="${loginUser.displayName}">医生</span>，当前
        <span th:if="${range == 'week'}">未来 7 天</span>
        <span th:unless="${range == 'week'}">
            <span th:if="${isToday}">今天</span>
            <span th:unless="${isToday}"><span th:text="${visitDate}">日期</span></span>
        </span>
        共 <span th:text="${#lists.size(appointments)}">0</span> 条预约，
        其中待就诊 <span th:text="${pendingCount}">0</span> 条。
    </p>

    <div th:replace="~{fragments/layout :: alert(${message}, 'error')}"></div>

    <!-- 筛选栏：日期 / 状态 / 快捷区间。doctorId 一律由会话决定，表单里没有这个字段 -->
    <section class="mt-6 rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
        <form th:action="@{/doctor/appointments}" method="get">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4">
                <div class="md-field relative">
                    <input id="date" name="date" type="date" placeholder=" " th:value="${dateParam}"
                           class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]" />
                    <label for="date" class="pointer-events-none">就诊日期</label>
                </div>

                <div class="md-field relative">
                    <select id="status" name="status"
                            class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]">
                        <option value="">全部状态</option>
                        <option value="0" th:selected="${status != null and status == 0}">待就诊</option>
                        <option value="1" th:selected="${status != null and status == 1}">已取消</option>
                    </select>
                    <label for="status" class="pointer-events-none">预约状态</label>
                </div>

                <div class="flex items-end">
                    <button type="submit"
                            class="w-full rounded-full bg-primary text-white hover:shadow-lg transition-all duration-200 font-medium ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] min-h-12 px-6 inline-flex items-center justify-center md:ripple">
                        按日期查询
                    </button>
                </div>
            </div>
        </form>

        <div class="mt-4 flex flex-wrap gap-3 md:gap-4">
            <a th:href="@{/doctor/appointments}"
               class="rounded-full bg-transparent text-primary border border-primary hover:shadow-lg transition-all duration-200 font-medium ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] min-h-10 px-5 inline-flex items-center justify-center md:ripple"
               style="text-decoration:none">今天</a>
            <a th:href="@{/doctor/appointments(range='week')}"
               class="rounded-full bg-transparent text-primary border border-primary hover:shadow-lg transition-all duration-200 font-medium ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] min-h-10 px-5 inline-flex items-center justify-center md:ripple"
               style="text-decoration:none">未来 7 天</a>
            <a th:href="@{/doctor/appointments(status=0)}"
               class="rounded-full bg-transparent text-primary border border-primary hover:shadow-lg transition-all duration-200 font-medium ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] min-h-10 px-5 inline-flex items-center justify-center md:ripple"
               style="text-decoration:none">今日待就诊</a>
        </div>
    </section>

    <!-- 预约列表 -->
    <section class="mt-6 rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
        <div class="md-table-wrap">
            <table class="md-table">
                <thead>
                <tr>
                    <th scope="col">流水号</th>
                    <th scope="col">就诊日期</th>
                    <th scope="col">就诊时段</th>
                    <th scope="col">患者姓名</th>
                    <th scope="col">性别</th>
                    <th scope="col">联系电话</th>
                    <th scope="col">状态</th>
                    <th scope="col">备注</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appt : ${appointments}">
                    <td th:text="${appt.serialNo}"></td>
                    <td th:text="${appt.visitDate}"></td>
                    <td th:text="${appt.timeSlot}"></td>
                    <td th:text="${appt.patientName}"></td>
                    <td th:text="${appt.patientGender} ?: '-'"></td>
                    <td th:text="${appt.patientPhone}"></td>
                    <td>
                        <span th:if="${!appt.cancelled}"
                              class="rounded-full bg-[#e6f4ea] text-[#137333] text-xs px-2 py-1"
                              th:text="${appt.statusLabel}">待就诊</span>
                        <span th:if="${appt.cancelled}"
                              class="rounded-full bg-[#fde7e9] text-[#b00020] text-xs px-2 py-1"
                              th:text="${appt.statusLabel}">已取消</span>
                    </td>
                    <td class="text-sm" th:text="${appt.remark} ?: '-'"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="8" class="text-center text-sm md:text-base text-[#757575] py-8">
                        该条件下没有预约记录
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer class="bg-[#f5f5f5] text-[#757575] py-8 px-4 md:px-6 lg:px-8 mt-8">
    <div class="max-w-6xl mx-auto text-sm">© 2026 预约挂号系统 · 实验二：基于 Spring Boot 集成 MyBatis 实现患者挂号</div>
</footer>

</body>
</html>
