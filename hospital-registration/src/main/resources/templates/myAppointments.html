<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('我的预约 - 预约挂号')}"></head>
<body class="min-h-screen bg-surface-dim text-on-surface font-sans antialiased">

<header th:replace="~{fragments/layout :: appbar('我的预约', 'mine')}"></header>

<main class="max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-8 md:py-12">

    <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-sans font-medium tracking-tight">我的预约</h1>
            <p class="text-sm md:text-base text-[#757575] mt-2">
                共 <span th:text="${appointments != null ? #lists.size(appointments) : 0}">0</span> 条预约记录。
                截至就诊日期前一天均可取消。
            </p>
        </div>
        <a th:href="@{/home}"
           class="rounded-full bg-primary text-white hover:shadow-lg transition-all duration-200 font-medium ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] min-h-10 px-6 inline-flex items-center justify-center md:ripple"
           style="text-decoration:none">继续预约</a>
    </div>

    <section class="mt-6 rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
        <div class="md-table-wrap">
            <table class="md-table">
                <thead>
                <tr>
                    <th scope="col">流水号</th>
                    <th scope="col">科室</th>
                    <th scope="col">医生</th>
                    <th scope="col">就诊日期</th>
                    <th scope="col">就诊时段</th>
                    <th scope="col">就诊人</th>
                    <th scope="col">状态</th>
                    <th scope="col">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appt : ${appointments}">
                    <td>
                        <a th:href="@{'/appointment/result/' + ${appt.id}}" class="text-primary"
                           style="text-decoration:none" th:text="${appt.serialNo}">APT000001</a>
                    </td>
                    <td th:text="${appt.deptName} ?: '-'"></td>
                    <td>
                        <span th:text="${appt.doctorName} ?: '-'">医生</span>
                        <span class="text-xs text-[#757575]" th:text="${appt.doctorTitle} ?: ''"></span>
                    </td>
                    <td th:text="${appt.visitDate}"></td>
                    <td th:text="${appt.timeSlot}"></td>
                    <td th:text="${appt.patientLabel}"></td>
                    <td>
                        <span th:if="${!appt.cancelled}"
                              class="rounded-full bg-[#e6f4ea] text-[#137333] text-xs px-2 py-1"
                              th:text="${appt.statusLabel}">待就诊</span>
                        <span th:if="${appt.cancelled}"
                              class="rounded-full bg-[#fde7e9] text-[#b00020] text-xs px-2 py-1"
                              th:text="${appt.statusLabel}">已取消</span>
                    </td>
                    <td>
                        <form th:if="${!appt.cancelled}" th:action="@{/appointment/cancel}" method="post"
                              class="inline">
                            <input type="hidden" name="id" th:value="${appt.id}">
                            <button type="submit"
                                    class="rounded-full bg-transparent text-[#b00020] border border-[#b00020] text-sm px-4 py-1 inline-flex items-center justify-center md:ripple"
                                    onclick="return confirm('确认取消该预约吗？');">取消</button>
                        </form>
                        <span th:if="${appt.cancelled}" class="text-xs text-[#757575]">已取消</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="8" class="text-center text-sm md:text-base text-[#757575] py-8">
                        还没有预约记录，去 <a th:href="@{/home}" class="text-primary"
                                        style="text-decoration:none">科室首页</a> 选择科室与医生吧。
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer class="bg-[#f5f5f5] text-[#757575] py-8 px-4 md:px-6 lg:px-8 mt-8">
    <div class="max-w-6xl mx-auto text-sm">© 2026 预约挂号系统 · 实验二：基于 Spring Boot 集成 MyBatis 实现患者挂号</div>
</footer>

</body>
</html>
