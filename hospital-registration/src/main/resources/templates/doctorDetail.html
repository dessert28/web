<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('医生详情 - 预约挂号')}"></head>
<body class="min-h-screen bg-surface-dim text-on-surface font-sans antialiased">

<header th:replace="~{fragments/layout :: appbar('医生详情', 'home')}"></header>

<main class="max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-8 md:py-12">

    <nav class="text-sm text-[#757575] mb-4">
        <a th:href="@{/home}" class="text-primary" style="text-decoration:none">科室首页</a>
        <span> / </span>
        <a th:if="${doctor != null and doctor.departmentId != null}"
           th:href="@{'/department/' + ${doctor.departmentId}}" class="text-primary"
           style="text-decoration:none" th:text="${department != null} ? ${department.deptName} : '所在科室'">科室</a>
        <span> / </span>
        <span th:text="${doctor != null} ? ${doctor.doctorName} : '未知医生'">医生</span>
    </nav>

    <div th:replace="~{fragments/layout :: alert(${message}, 'error')}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">

        <!-- 医生资料 -->
        <section th:if="${doctor != null}"
                 class="lg:col-span-1 rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
            <div class="flex items-center gap-3">
                <div class="rounded-full w-12 h-12 bg-primary text-white flex items-center justify-center text-lg font-medium"
                     th:text="${#strings.substring(doctor.doctorName, 0, 1)}">医</div>
                <div>
                    <h1 class="text-xl md:text-2xl font-sans font-medium tracking-tight"
                        th:text="${doctor.doctorName}">医生姓名</h1>
                    <p class="text-sm text-[#757575]" th:text="${doctor.title}">职称</p>
                </div>
            </div>

            <dl class="mt-5 space-y-3 text-sm md:text-base">
                <div class="flex gap-2">
                    <dt class="text-[#757575] w-20 shrink-0">医生ID</dt>
                    <dd class="text-[#212121]" th:text="${doctor.id}">1</dd>
                </div>
                <div class="flex gap-2">
                    <dt class="text-[#757575] w-20 shrink-0">性别</dt>
                    <dd class="text-[#212121]" th:text="${doctor.genderLabel}">男</dd>
                </div>
                <div class="flex gap-2">
                    <dt class="text-[#757575] w-20 shrink-0">职称</dt>
                    <dd class="text-[#212121]" th:text="${doctor.title}">主任医师</dd>
                </div>
                <div class="flex gap-2">
                    <dt class="text-[#757575] w-20 shrink-0">所属科室</dt>
                    <dd class="text-[#212121]"
                        th:text="${department != null} ? ${department.deptName} : (${doctor.department} ?: '未登记')">科室</dd>
                </div>
                <div class="flex gap-2">
                    <dt class="text-[#757575] w-20 shrink-0">联系电话</dt>
                    <dd class="text-[#212121]" th:text="${doctor.phone} ?: '未登记'">电话</dd>
                </div>
                <div class="pt-3 border-t border-[#eeeeee]">
                    <dt class="text-[#757575] mb-1">专业专长</dt>
                    <dd class="text-[#212121] leading-7" th:text="${doctor.specialty} ?: '暂未填写'">专长</dd>
                </div>
            </dl>
        </section>

        <section th:if="${doctor == null}"
                 class="lg:col-span-1 rounded-xl bg-white p-6 text-center text-[#757575] shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
            医生不存在或已下线。
        </section>

        <!-- 挂号表单 -->
        <section th:if="${doctor != null}"
                 class="lg:col-span-2 rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)]">
            <h2 class="font-sans font-medium tracking-tight text-lg md:text-xl">预约挂号</h2>
            <p class="text-sm text-[#757575] mt-1">
                可预约日期：<span th:text="${earliestDate}">今天</span> 至 <span th:text="${latestDate}">+14天</span>
            </p>

            <form th:action="@{/appointment/submit}" method="post" class="mt-4">
                <input type="hidden" name="doctorId" th:value="${doctor.id}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                    <div class="md-field relative">
                        <input id="visitDate" name="visitDate" type="date" placeholder=" " required
                               th:min="${earliestDate}" th:max="${latestDate}"
                               th:value="${form != null and form.visitDate != null} ? ${form.visitDate} : ${earliestDate}"
                               class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]" />
                        <label for="visitDate" class="pointer-events-none">就诊日期</label>
                    </div>

                    <div class="md-field relative">
                        <select id="timeSlot" name="timeSlot" required
                                class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]">
                            <option value="">请选择时段</option>
                            <option th:each="slot : ${timeSlots}" th:value="${slot}" th:text="${slot}"
                                    th:selected="${form != null and slot == form.timeSlot}">时段</option>
                        </select>
                        <label for="timeSlot" class="pointer-events-none">就诊时段</label>
                    </div>

                    <div class="md-field relative">
                        <input id="patientName" name="patientName" type="text" placeholder=" " required
                               th:value="${form != null} ? ${form.patientName} : ${loginUser.displayName}"
                               class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]" />
                        <label for="patientName" class="pointer-events-none">就诊人姓名</label>
                    </div>

                    <div class="md-field relative">
                        <select id="patientGender" name="patientGender"
                                class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]">
                            <option value="">请选择性别</option>
                            <option value="男" th:selected="${form != null and form.patientGender == '男'}">男</option>
                            <option value="女" th:selected="${form != null and form.patientGender == '女'}">女</option>
                            <option value="其他" th:selected="${form != null and form.patientGender == '其他'}">其他</option>
                        </select>
                        <label for="patientGender" class="pointer-events-none">就诊人性别</label>
                    </div>

                    <div class="md-field relative">
                        <input id="patientPhone" name="patientPhone" type="tel" placeholder=" " required
                               th:value="${form != null} ? ${form.patientPhone} : ''"
                               class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]" />
                        <label for="patientPhone" class="pointer-events-none">联系电话</label>
                    </div>

                    <div class="md-field relative">
                        <input id="patientIdCard" name="patientIdCard" type="text" placeholder=" "
                               th:value="${form != null} ? ${form.patientIdCard} : ''"
                               class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]" />
                        <label for="patientIdCard" class="pointer-events-none">身份证号（可选）</label>
                    </div>
                </div>

                <div class="md-field relative mt-3 md:mt-4">
                    <input id="remark" name="remark" type="text" placeholder=" "
                           th:value="${form != null} ? ${form.remark} : ''"
                           class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]" />
                    <label for="remark" class="pointer-events-none">症状描述 / 备注（可选）</label>
                </div>

                <div class="mt-5 flex flex-wrap gap-3 md:gap-4">
                    <button type="submit"
                            class="rounded-full bg-primary text-white hover:shadow-lg transition-all duration-200 font-medium ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] min-h-12 px-8 inline-flex items-center justify-center md:ripple">
                        提交挂号
                    </button>
                    <a th:href="@{/myAppointments}"
                       class="rounded-full bg-transparent text-primary border border-primary hover:shadow-lg transition-all duration-200 font-medium ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] min-h-12 px-6 inline-flex items-center justify-center md:ripple"
                       style="text-decoration:none">我的预约</a>
                </div>
            </form>
        </section>

    </div>

</main>

<footer class="bg-[#f5f5f5] text-[#757575] py-8 px-4 md:px-6 lg:px-8 mt-8">
    <div class="max-w-6xl mx-auto text-sm">© 2026 预约挂号系统 · 实验二：基于 Spring Boot 集成 MyBatis 实现患者挂号</div>
</footer>

</body>
</html>
