<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户登录</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="page">
    <section class="card">
        <h1>欢迎登录</h1>
        <p class="notice success" th:if="${message}" th:text="${message}"></p>
        <p class="notice" th:if="${error}" th:text="${error}"></p>
        <form method="post" action="/login">
            <div class="field"><label for="username">用户名</label><input id="username" name="username" minlength="3" maxlength="20" required autofocus></div>
            <div class="field"><label for="password">密码</label><input id="password" type="password" name="password" minlength="6" required></div>
            <button class="button" type="submit">登录</button>
        </form>
        <p class="switch">还没有账号？<a href="/register">立即注册</a></p>
    </section>
</main>
</body>
</html>
