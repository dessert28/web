<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>欢迎来到我的网站,这里是主页</h1>
<!--用户名：<span th:text="${username}"></span>
密码：<span th:text="${password}"></span>-->
<!--读取用户信息列表，使用th:each循环遍历，并以表格形式展示-->
<table border="1">
    <tr>
        <th>用户名</th>
        <th>密码</th>
    </tr>
    <tr th:each="user : ${usersList}">
        <td th:text="${user.username}"></td>
        <td th:text="${user.password}"></td>
    </tr>
</table>
<a href="/logout">退出登录</a>
<a href="/logout2">退出登录2</a>


</body>
</html>
