<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>欢迎来到我的网站</title>
    <script th:src="@{/vendor/tailwindcss-3.4.16.js}"></script>
    <script th:src="@{/vendor/md-material.config.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/md-roboto.css}">
    <link rel="stylesheet" th:href="@{/css/md-material.css}">
</head>
<body class="min-h-screen bg-surface-dim text-on-surface font-sans antialiased">

    <header class="md-appbar px-4 md:px-6 lg:px-8">
        <div class="md-appbar__inner max-w-6xl mx-auto flex items-center justify-between gap-4">
            <span class="font-sans font-medium tracking-tight text-xl md:text-2xl text-white">My Site</span>
            <span class="font-sans text-white/80 text-xs md:text-sm">课程演示站点</span>
        </div>
    </header>

    <main>
        <section class="bg-primary text-white py-10 md:py-16 lg:py-24 px-4 md:px-6 lg:px-8">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="font-sans font-medium tracking-tight text-4xl md:text-6xl lg:text-7xl">欢迎来到我的网站</h1>
                <p class="font-sans text-sm md:text-base text-white/85 mt-4 max-w-xl mx-auto">
                    这是一个用于课程演示的示例站点，展示统一的 Material Design 视觉与交互规范。
                </p>
                <div class="mt-4 md:mt-8 flex justify-center">
                    <a href="/toLogin" class="md-ripple inline-flex items-center justify-center rounded-full bg-white text-primary font-medium px-6 md:px-8 min-h-12 text-sm md:text-base hover:shadow-lg transition-all duration-200 ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] active:duration-100">还未登录</a>
                </div>
            </div>
        </section>

        <section class="py-10 md:py-16 lg:py-24 px-4 md:px-6 lg:px-8">
            <div class="max-w-6xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4">
                    <article class="rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)] transition-all ease-[cubic-bezier(0.4,0,0.2,1)] duration-[250ms] hover:-translate-y-1 hover:shadow-[0_14px_28px_rgba(0,0,0,0.25),0_10px_10px_rgba(0,0,0,0.22)]">
                        <h2 class="font-sans font-medium tracking-tight text-xl md:text-2xl">分层与海拔</h2>
                        <p class="font-sans text-sm md:text-base text-[#757575] mt-4">用两级阴影表达卡片层次，悬停时抬升海拔，让界面具有真实的纸张物理感。</p>
                    </article>
                    <article class="rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)] transition-all ease-[cubic-bezier(0.4,0,0.2,1)] duration-[250ms] hover:-translate-y-1 hover:shadow-[0_14px_28px_rgba(0,0,0,0.25),0_10px_10px_rgba(0,0,0,0.22)]">
                        <h2 class="font-sans font-medium tracking-tight text-xl md:text-2xl">统一动效</h2>
                        <p class="font-sans text-sm md:text-base text-[#757575] mt-4">所有过渡使用 Material 标准缓动曲线，按下时轻微缩放，提供即时的触感反馈。</p>
                    </article>
                    <article class="rounded-xl bg-white p-4 md:p-6 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)] transition-all ease-[cubic-bezier(0.4,0,0.2,1)] duration-[250ms] hover:-translate-y-1 hover:shadow-[0_14px_28px_rgba(0,0,0,0.25),0_10px_10px_rgba(0,0,0,0.22)]">
                        <h2 class="font-sans font-medium tracking-tight text-xl md:text-2xl">响应式布局</h2>
                        <p class="font-sans text-sm md:text-base text-[#757575] mt-4">从手机到桌面使用同一套网格与间距，375px 窄屏同样保持整洁不溢出。</p>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-[#f5f5f5] text-[#757575] py-8 px-4 md:px-6 lg:px-8">
        <div class="max-w-6xl mx-auto text-xs md:text-sm">
            © 2026 课程演示站点 · 仅供学习使用
        </div>
    </footer>

</body>
</html>
