<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录</title>
    <script th:src="@{/vendor/tailwindcss-3.4.16.js}"></script>
    <script th:src="@{/vendor/md-material.config.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/md-roboto.css}">
    <link rel="stylesheet" th:href="@{/css/md-material.css}">
</head>
<body class="min-h-screen bg-surface-dim text-on-surface font-sans antialiased flex items-center justify-center px-4 py-8">
<!--登录页面-->
<main class="w-full max-w-md rounded-xl bg-white p-6 md:p-8 shadow-[0_1px_3px_rgba(0,0,0,0.12),0_1px_2px_rgba(0,0,0,0.24)] transition-all ease-[cubic-bezier(0.4,0,0.2,1)] duration-[250ms] hover:-translate-y-1 hover:shadow-[0_14px_28px_rgba(0,0,0,0.25),0_10px_10px_rgba(0,0,0,0.22)]">
    <div class="flex flex-col items-center">
        <div class="rounded-full w-12 h-12 flex items-center justify-center text-white bg-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6" aria-hidden="true" focusable="false">
                <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/>
            </svg>
        </div>
        <h1 class="text-2xl md:text-3xl font-sans font-medium tracking-tight mt-4">登录</h1>
    </div>

    <div th:if="${message}" class="rounded-md bg-[#fde7e9] text-[#b00020] px-3 py-2 text-sm mb-4 flex items-start gap-2" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 mt-1 shrink-0" aria-hidden="true" focusable="false">
            <path fill-rule="evenodd" d="M12 2.25 1.5 21h21L12 2.25Zm.75 6h-1.5v6h1.5v-6Zm0 8h-1.5v1.5h1.5V16.25Z" clip-rule="evenodd"/>
        </svg>
        <span th:text="${message}"></span>
    </div>

    <form action="/login" method="post">
        <div class="md-field relative mb-4">
            <input id="username" name="username" type="text" placeholder=" " required
                   class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]" />
            <label for="username" class="pointer-events-none">用户名</label>
        </div>
        <div class="md-field relative mb-4">
            <input id="password" name="password" type="password" placeholder=" " required
                   class="peer w-full rounded-md border border-gray-400 bg-transparent px-3 pt-6 pb-2 text-base focus:border-[#6200ee] focus:outline-none transition-colors duration-200 ease-[cubic-bezier(0.4,0,0.2,1)]" />
            <label for="password" class="pointer-events-none">密码</label>
        </div>
        <button type="submit" class="md-ripple w-full rounded-full bg-primary text-white font-medium min-h-12 px-6 hover:shadow-lg transition-all duration-200 ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-[0.98] active:duration-100">登录</button>
    </form>

    <p class="mt-6 text-center text-xs md:text-sm text-[#757575]">课程演示账号：admin / 123</p>
</main>
</body>
</html>
