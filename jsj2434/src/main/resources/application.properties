# 应用名称，便于在日志等位置识别项目。
spring.application.name=jsj2434
# 模板名后缀：控制器返回 login 时补为 login.html。
spring.thymeleaf.suffix=.html
# 从 classpath 中的 templates 目录加载 Thymeleaf 模板。
spring.thymeleaf.prefix=classpath:/templates/
# MySQL 数据源：本机 3306，库名 jsj2434，账号 root/root。
spring.datasource.url=jdbc:mysql://localhost:3306/jsj2434?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver