spring.application.name=jsj2434
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# 数据源：库 javaweb 由仓库根 javaweb.sql 初始化（无 spring.sql.init.*，换机器先导入该脚本）
spring.datasource.url=jdbc:mysql://localhost:3306/javaweb?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.password=root
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mybatis 配置：XML 映射文件位置与 domain 别名包
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.zjsru.domain
